name: Tests and build

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax checks
        run: |
          for file in src/*.js; do node --check "$file"; done
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - name: Build generated HTML
        run: FONT_MODE=google OUT=/tmp/bible-diary-ci.html python3 src/build.py
      - name: Check generated HTML exists
        run: test -s /tmp/bible-diary-ci.html
